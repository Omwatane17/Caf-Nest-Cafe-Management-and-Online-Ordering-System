<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Reviews | CafeNest Admin</title>
  <meta name="description" content="View and respond to customer feedback for The Brew House on CafeNest Admin.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/reviews.css">
</head>
<body>

  <!-- ── App Shell ── -->
  <div class="admin-shell">

    <!-- SIDEBAR (populated by renderShell('reviews') in admin.js) -->
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar navigation"></aside>

    <!-- BACKDROP (mobile drawer overlay) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" role="presentation" hidden></div>

    <!-- MAIN COLUMN -->
    <div class="admin-main">

      <!-- TOP BAR -->
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>

      <!-- PAGE CONTENT -->
      <main class="admin-page-content" id="main-content" aria-labelledby="reviews-heading">

        <!-- Top Section: Header Title + Right-side Rating Summary Cards -->
        <section class="reviews-top-section" aria-label="Reviews overview">
          <!-- Left: Title & Subtitle -->
          <div class="reviews-title-block">
            <h1 class="reviews-heading" id="reviews-heading">Customer Reviews</h1>
            <p class="reviews-sub">View and respond to customer feedback.</p>
          </div>

          <!-- Right: Summary Cards (Average Rating + Distribution) -->
          <div class="reviews-summary-cards" id="reviews-summary-cards">
            <!-- Dynamically populated by reviews.js -->
          </div>
        </section>

        <!-- Customer Reviews List -->
        <section class="reviews-list-container" id="reviews-list-container" role="feed" aria-label="Customer reviews feed">
          <!-- Dynamically populated by reviews.js -->
        </section>

      </main>

    </div><!-- /.admin-main -->
  </div><!-- /.admin-shell -->

  <!-- ================================================================
       REPLY MODAL
       ================================================================ -->
  <div class="modal-backdrop" id="modal-reply" hidden role="dialog" aria-modal="true" aria-labelledby="modal-reply-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-reply-title">Reply to Review</h2>
        <button type="button" class="btn-modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form class="modal-body" id="form-reply" novalidate>
        <blockquote class="reply-quote-preview" id="reply-quote-preview">
          <!-- Review comment preview -->
        </blockquote>

        <div class="form-group">
          <label for="reply-text" class="form-label">Your Response <span aria-hidden="true">*</span></label>
          <textarea id="reply-text" class="reply-textarea" placeholder="Type your response to the customer..." rows="3" required></textarea>
        </div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel">Cancel</button>
        <button type="submit" form="form-reply" class="btn-modal-primary" id="btn-submit-reply">Send Reply</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="admin-toast-container" class="admin-toast-container" aria-live="polite"></div>

  <!-- Scripts: data -> admin shell -> reviews logic -->
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/reviews.js"></script>
</body>
</html>
