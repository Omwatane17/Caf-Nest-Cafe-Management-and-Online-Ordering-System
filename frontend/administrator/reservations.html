<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservations | CafeNest Admin</title>
  <meta name="description" content="View and manage all customer reservations for The Brew House on CafeNest Admin.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/reservations.css">
</head>
<body>

  <!-- ── App Shell ── -->
  <div class="admin-shell">

    <!-- SIDEBAR (populated by renderShell('reservations') in admin.js) -->
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar navigation"></aside>

    <!-- BACKDROP (mobile drawer overlay) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" role="presentation" hidden></div>

    <!-- MAIN COLUMN -->
    <div class="admin-main">

      <!-- TOP BAR -->
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>

      <!-- PAGE CONTENT -->
      <main class="admin-page-content" id="main-content" aria-labelledby="reservations-heading">

        <!-- Page Header -->
        <div class="reservations-header">
          <div>
            <h1 class="reservations-heading" id="reservations-heading">Reservations</h1>
            <p class="reservations-sub">View and manage all customer reservations.</p>
          </div>

          <!-- Header Right: Date Picker, Status Filter, View Calendar Button -->
          <div class="reservations-controls">
            <!-- Date Picker Control -->
            <div class="date-picker-wrap">
              <button type="button" class="date-picker-btn" id="date-picker-btn" aria-label="Select date filter">
                <svg class="date-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                  <line x1="16" y1="2" x2="16" y2="6"/>
                  <line x1="8" y1="2" x2="8" y2="6"/>
                  <line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span id="current-date-label">12 Oct 2026</span>
                <svg class="date-arrows" viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="7 15 12 20 17 15"/>
                  <polyline points="7 9 12 4 17 9"/>
                </svg>
              </button>
              <input type="date" class="hidden-date-input" id="hidden-date-input" value="2026-10-12" aria-label="Filter reservations by date">
            </div>

            <!-- Status Dropdown Filter -->
            <div class="status-select-wrap">
              <label for="status-filter" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Filter by status</label>
              <select id="status-filter" class="status-select" aria-label="Filter reservations by status">
                <option value="All" selected>All Status</option>
                <option value="Confirmed">Confirmed</option>
                <option value="Pending">Pending</option>
                <option value="Cancelled">Cancelled</option>
              </select>
              <svg class="select-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>

            <!-- View Calendar Button -->
            <button type="button" class="btn-view-calendar" id="btn-view-calendar" aria-label="Open calendar overview">
              View Calendar
            </button>
          </div>
        </div>

        <!-- Filter Reset / Feedback Bar (shows when filters are applied) -->
        <div class="filter-reset-bar" id="filter-reset-bar" hidden>
          <span id="filter-summary-text">Showing reservations for 12 Oct 2026</span>
          <button type="button" class="btn-filter-reset" id="btn-reset-filters">Show All Dates</button>
        </div>

        <!-- Reservations Table Card -->
        <div class="table-card">
          <div class="table-responsive-wrap">
            <table class="reservations-table" aria-label="Customer reservations table">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Customer Name</th>
                  <th scope="col">Date &amp; Time</th>
                  <th scope="col">Table</th>
                  <th scope="col" class="col-guests">Guests</th>
                  <th scope="col" class="col-status">Status</th>
                  <th scope="col" class="col-action">Action</th>
                </tr>
              </thead>
              <tbody id="reservations-tbody">
                <!-- Dynamically populated by reservations.js -->
              </tbody>
            </table>
          </div>
        </div>

      </main>

    </div><!-- /.admin-main -->
  </div><!-- /.admin-shell -->

  <!-- ================================================================
       VIEW RESERVATION DETAILS MODAL
       ================================================================ -->
  <div class="modal-backdrop" id="modal-details" hidden role="dialog" aria-modal="true" aria-labelledby="details-modal-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="details-modal-title">Reservation Details</h2>
        <button type="button" class="btn-modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" id="details-modal-body">
        <!-- Rendered dynamically -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel">Close</button>
      </div>
    </div>
  </div>

  <!-- ================================================================
       CHANGE STATUS MODAL
       ================================================================ -->
  <div class="modal-backdrop" id="modal-status" hidden role="dialog" aria-modal="true" aria-labelledby="status-modal-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="status-modal-title">Update Status</h2>
        <button type="button" class="btn-modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 12px;font-size:0.92rem;color:var(--color-muted);">Select the new status for this reservation:</p>
        <div class="status-options-group" role="radiogroup" aria-label="Reservation status options">
          <label class="status-radio-card">
            <input type="radio" name="res-status-choice" value="Confirmed">
            <span class="status-pill status-confirmed">Confirmed</span>
          </label>
          <label class="status-radio-card">
            <input type="radio" name="res-status-choice" value="Pending">
            <span class="status-pill status-pending">Pending</span>
          </label>
          <label class="status-radio-card">
            <input type="radio" name="res-status-choice" value="Cancelled">
            <span class="status-pill status-cancelled">Cancelled</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel">Cancel</button>
        <button type="button" class="btn-modal-primary" id="btn-save-status">Update Status</button>
      </div>
    </div>
  </div>

  <!-- ================================================================
       VIEW CALENDAR OVERVIEW MODAL
       ================================================================ -->
  <div class="modal-backdrop" id="modal-calendar" hidden role="dialog" aria-modal="true" aria-labelledby="cal-modal-title">
    <div class="modal-dialog calendar-card">
      <div class="modal-header">
        <h2 class="modal-title" id="cal-modal-title">October 2026 Overview</h2>
        <button type="button" class="btn-modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <p style="margin:0 0 12px;font-size:0.9rem;color:var(--color-muted);">Select a date to filter reservations:</p>
        <div class="cal-grid" id="calendar-month-grid">
          <!-- Rendered dynamically -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="admin-toast-container" class="admin-toast-container" aria-live="polite"></div>

  <!-- Scripts: data -> admin shell -> reservations logic -->
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/reservations.js"></script>
</body>
</html>
