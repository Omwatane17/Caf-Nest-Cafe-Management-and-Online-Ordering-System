<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seating Arrangement | CafeNest Admin</title>
  <meta name="description" content="Manage tables and view the seating layout for The Brew House on CafeNest Admin.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/seating.css">
</head>
<body>

  <!-- ── App Shell ── -->
  <div class="admin-shell">

    <!-- SIDEBAR (populated by renderShell('seating') in admin.js) -->
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin sidebar navigation"></aside>

    <!-- BACKDROP (mobile drawer overlay) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" role="presentation" hidden></div>

    <!-- MAIN COLUMN -->
    <div class="admin-main">

      <!-- TOP BAR -->
      <header class="admin-topbar" id="admin-topbar" role="banner"></header>

      <!-- PAGE CONTENT -->
      <main class="admin-page-content" id="main-content" aria-labelledby="seating-heading">

        <!-- Page Header -->
        <div class="seating-page-header">
          <div>
            <h1 class="seating-page-heading" id="seating-heading">Seating Arrangement</h1>
            <p class="seating-page-sub">Manage tables and view the seating layout.</p>
          </div>

          <!-- Header Right Actions: Zone Dropdown + Add Table Button -->
          <div class="seating-header-actions">
            <div class="zone-select-wrap">
              <label for="zone-select" class="visually-hidden" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0;">Select Zone</label>
              <select id="zone-select" class="zone-select" aria-label="Select seating zone">
                <option value="Indoor" selected>Indoor</option>
                <option value="Outdoor">Outdoor</option>
                <option value="Private">Private</option>
              </select>
              <svg class="zone-select-arrow" viewBox="0 0 24 24" aria-hidden="true">
                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>

            <button type="button" class="btn-add-table" id="btn-add-table" aria-label="Add new table">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              + Add Table
            </button>
          </div>
        </div>

        <!-- Seating Layout: 2-column Floor Plan & Table Details -->
        <div class="seating-layout">

          <!-- Left Column: Floor Plan Container & Status Legend -->
          <div class="floor-plan-column">
            <div class="floor-plan-card">
              <div class="floor-plan-canvas" id="floor-plan-canvas" role="region" aria-label="Cafe seating floor plan">

                <!-- Architectural Walls -->
                <div class="floor-wall-top" aria-hidden="true"></div>
                <div class="floor-wall-bottom" aria-hidden="true"></div>
                <div class="floor-wall-left" aria-hidden="true"></div>
                <div class="floor-wall-right" aria-hidden="true"></div>

                <!-- Top Entrance & Door Swing -->
                <div class="entrance-portal entrance-top" aria-label="Top Entrance">Entrance</div>
                <div class="door-swing-arc door-swing-top-left" aria-hidden="true"></div>
                <div class="door-swing-arc door-swing-top-right" aria-hidden="true"></div>

                <!-- Bottom Entrance & Door Swing -->
                <div class="entrance-portal entrance-bottom" aria-label="Bottom Entrance">Entrance</div>
                <div class="door-swing-arc door-swing-bot-left" aria-hidden="true"></div>
                <div class="door-swing-arc door-swing-bot-right" aria-hidden="true"></div>

                <!-- Botanical Planter Boxes & Corner Plants -->
                <!-- Top-Left Plants -->
                <div class="plan-decor plant-corner-tl" aria-hidden="true">
                  <svg width="46" height="46" viewBox="0 0 46 46">
                    <circle cx="23" cy="23" r="10" fill="#B57C48" stroke="#7A4E27" stroke-width="1.5"/>
                    <path d="M23 13 C21 4, 13 8, 17 18 Z" fill="#4E823C"/>
                    <path d="M23 13 C25 4, 33 8, 29 18 Z" fill="#619B4C"/>
                    <path d="M13 23 C4 21, 8 13, 18 17 Z" fill="#588D43"/>
                    <path d="M33 23 C42 21, 38 13, 28 17 Z" fill="#4E823C"/>
                    <path d="M14 28 C7 35, 16 39, 21 31 Z" fill="#619B4C"/>
                    <path d="M32 28 C39 35, 30 39, 25 31 Z" fill="#4E823C"/>
                    <circle cx="23" cy="23" r="5" fill="#3D682E"/>
                  </svg>
                </div>

                <!-- Top-Right Plants -->
                <div class="plan-decor plant-corner-tr" aria-hidden="true">
                  <svg width="46" height="46" viewBox="0 0 46 46">
                    <circle cx="23" cy="23" r="10" fill="#B57C48" stroke="#7A4E27" stroke-width="1.5"/>
                    <path d="M23 13 C21 4, 13 8, 17 18 Z" fill="#4E823C"/>
                    <path d="M23 13 C25 4, 33 8, 29 18 Z" fill="#619B4C"/>
                    <path d="M13 23 C4 21, 8 13, 18 17 Z" fill="#588D43"/>
                    <path d="M33 23 C42 21, 38 13, 28 17 Z" fill="#4E823C"/>
                    <path d="M14 28 C7 35, 16 39, 21 31 Z" fill="#619B4C"/>
                    <path d="M32 28 C39 35, 30 39, 25 31 Z" fill="#4E823C"/>
                    <circle cx="23" cy="23" r="5" fill="#3D682E"/>
                  </svg>
                </div>

                <!-- Bottom-Left Plants -->
                <div class="plan-decor plant-corner-bl" aria-hidden="true">
                  <svg width="44" height="44" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="9" fill="#B57C48" stroke="#7A4E27" stroke-width="1.5"/>
                    <path d="M22 13 C20 5, 13 9, 16 18 Z" fill="#4E823C"/>
                    <path d="M22 13 C24 5, 31 9, 28 18 Z" fill="#619B4C"/>
                    <path d="M13 22 C5 20, 9 13, 18 16 Z" fill="#588D43"/>
                    <path d="M31 22 C39 20, 35 13, 26 16 Z" fill="#4E823C"/>
                    <path d="M14 27 C8 33, 16 37, 20 29 Z" fill="#619B4C"/>
                    <path d="M30 27 C36 33, 28 37, 24 29 Z" fill="#4E823C"/>
                    <circle cx="22" cy="22" r="4.5" fill="#3D682E"/>
                  </svg>
                </div>

                <!-- Bottom-Right Plants -->
                <div class="plan-decor plant-corner-br" aria-hidden="true">
                  <svg width="44" height="44" viewBox="0 0 44 44">
                    <circle cx="22" cy="22" r="9" fill="#B57C48" stroke="#7A4E27" stroke-width="1.5"/>
                    <path d="M22 13 C20 5, 13 9, 16 18 Z" fill="#4E823C"/>
                    <path d="M22 13 C24 5, 31 9, 28 18 Z" fill="#619B4C"/>
                    <path d="M13 22 C5 20, 9 13, 18 16 Z" fill="#588D43"/>
                    <path d="M31 22 C39 20, 35 13, 26 16 Z" fill="#4E823C"/>
                    <path d="M14 27 C8 33, 16 37, 20 29 Z" fill="#619B4C"/>
                    <path d="M30 27 C36 33, 28 37, 24 29 Z" fill="#4E823C"/>
                    <circle cx="22" cy="22" r="4.5" fill="#3D682E"/>
                  </svg>
                </div>

                <!-- Top Planter Hedge Boxes -->
                <div class="plan-decor planter-box-top-left" aria-hidden="true">
                  <svg width="58" height="24" viewBox="0 0 58 24">
                    <rect x="2" y="2" width="54" height="20" rx="3" fill="#846E56" stroke="#5D4B39" stroke-width="1.5"/>
                    <circle cx="16" cy="12" r="7" fill="#588D43"/>
                    <circle cx="29" cy="12" r="7.5" fill="#4E823C"/>
                    <circle cx="42" cy="12" r="7" fill="#619B4C"/>
                  </svg>
                </div>

                <div class="plan-decor planter-box-top-right" aria-hidden="true">
                  <svg width="58" height="24" viewBox="0 0 58 24">
                    <rect x="2" y="2" width="54" height="20" rx="3" fill="#846E56" stroke="#5D4B39" stroke-width="1.5"/>
                    <circle cx="16" cy="12" r="7" fill="#588D43"/>
                    <circle cx="29" cy="12" r="7.5" fill="#4E823C"/>
                    <circle cx="42" cy="12" r="7" fill="#619B4C"/>
                  </svg>
                </div>

                <!-- Left Wall: Modern Sage Sofa Bench -->
                <div class="plan-decor furniture-sofa-left" aria-hidden="true">
                  <svg width="38" height="120" viewBox="0 0 38 120">
                    <rect x="2" y="2" width="34" height="116" rx="6" fill="#A4B797" stroke="#6E7E63" stroke-width="1.5"/>
                    <!-- Cushions -->
                    <rect x="6" y="8" width="26" height="32" rx="3" fill="#B3C4A6" stroke="#8A9D7D" stroke-width="1"/>
                    <rect x="6" y="44" width="26" height="32" rx="3" fill="#B3C4A6" stroke="#8A9D7D" stroke-width="1"/>
                    <rect x="6" y="80" width="26" height="32" rx="3" fill="#B3C4A6" stroke="#8A9D7D" stroke-width="1"/>
                  </svg>
                </div>

                <!-- Right Wall: Lounge Armchair & Side Table -->
                <div class="plan-decor furniture-sofa-right" aria-hidden="true">
                  <svg width="36" height="96" viewBox="0 0 36 96">
                    <rect x="2" y="2" width="32" height="92" rx="5" fill="#A4B797" stroke="#6E7E63" stroke-width="1.5"/>
                    <rect x="4" y="6" width="28" height="38" rx="3" fill="#B3C4A6" stroke="#8A9D7D" stroke-width="1"/>
                    <rect x="4" y="48" width="28" height="42" rx="3" fill="#B3C4A6" stroke="#8A9D7D" stroke-width="1"/>
                  </svg>
                </div>

                <!-- Bottom Right Console Table / Beverage Station -->
                <div class="plan-decor furniture-counter-br" aria-hidden="true">
                  <svg width="72" height="28" viewBox="0 0 72 28">
                    <rect x="1" y="1" width="70" height="26" rx="4" fill="#9FB294" stroke="#65765A" stroke-width="1.5"/>
                    <!-- Coffee icon decorations -->
                    <circle cx="16" cy="14" r="5" fill="#F4EDE0" stroke="#65765A" stroke-width="1"/>
                    <circle cx="36" cy="14" r="4.5" fill="#E8DEC8" stroke="#65765A" stroke-width="1"/>
                    <rect x="50" y="8" width="14" height="12" rx="2" fill="#588D43" stroke="#447030" stroke-width="1"/>
                  </svg>
                </div>

                <!-- Table Nodes will be dynamically injected here by seating.js -->

              </div><!-- /#floor-plan-canvas -->
            </div><!-- /.floor-plan-card -->

            <!-- Status Legend beneath the map -->
            <div class="status-legend" role="group" aria-label="Table status legend">
              <div class="legend-item">
                <span class="legend-dot dot-available" aria-hidden="true"></span>
                <span>Available</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot dot-occupied" aria-hidden="true"></span>
                <span>Occupied</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot dot-reserved" aria-hidden="true"></span>
                <span>Reserved</span>
              </div>
              <div class="legend-item">
                <span class="legend-dot dot-unavailable" aria-hidden="true"></span>
                <span>Unavailable</span>
              </div>
            </div>

          </div><!-- /.floor-plan-column -->

          <!-- Right Column: Table Details & Quick Actions Card -->
          <div class="table-details-card" id="table-details-panel" role="region" aria-label="Table details and quick actions">
            <!-- Dynamically populated by seating.js -->
          </div>

        </div><!-- /.seating-layout -->

      </main>

    </div><!-- /.admin-main -->
  </div><!-- /.admin-shell -->

  <!-- ================================================================
       ADD TABLE MODAL
       ================================================================ -->
  <div class="modal-backdrop" id="modal-add-table" hidden role="dialog" aria-modal="true" aria-labelledby="modal-add-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-add-title">Add Table</h2>
        <button type="button" class="btn-modal-close" id="btn-modal-close" aria-label="Close dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form class="modal-body" id="form-add-table" novalidate>
        <!-- Table ID -->
        <div class="form-group">
          <label for="field-table-id" class="form-label">Table ID <span aria-hidden="true">*</span></label>
          <input type="text" id="field-table-id" class="form-input" placeholder="e.g. T14" required autocomplete="off">
          <span class="field-error" id="err-table-id" role="alert" aria-live="polite"></span>
        </div>

        <!-- Capacity & Type Row -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="field-capacity" class="form-label">Capacity <span aria-hidden="true">*</span></label>
            <input type="number" id="field-capacity" class="form-input" value="4" min="1" max="20" required>
            <span class="field-error" id="err-capacity" role="alert" aria-live="polite"></span>
          </div>

          <div class="form-group">
            <label for="field-type" class="form-label">Table Type</label>
            <select id="field-type" class="form-select">
              <option value="Round" selected>Round</option>
              <option value="Square">Square</option>
            </select>
          </div>
        </div>

        <!-- Seating Zone & Initial Status Row -->
        <div class="form-row-2">
          <div class="form-group">
            <label for="field-zone" class="form-label">Seating Zone</label>
            <select id="field-zone" class="form-select">
              <option value="Indoor" selected>Indoor</option>
              <option value="Outdoor">Outdoor</option>
              <option value="Private">Private</option>
            </select>
          </div>

          <div class="form-group">
            <label for="field-status" class="form-label">Initial Status</label>
            <select id="field-status" class="form-select">
              <option value="Available" selected>Available</option>
              <option value="Occupied">Occupied</option>
              <option value="Reserved">Reserved</option>
              <option value="Unavailable">Unavailable</option>
            </select>
          </div>
        </div>
      </form>

      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel" id="btn-modal-cancel">Cancel</button>
        <button type="submit" form="form-add-table" class="btn-modal-primary" id="btn-modal-submit">Add Table</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="admin-toast-container" class="admin-toast-container" aria-live="polite"></div>

  <!-- Scripts: data -> admin shell -> seating logic -->
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/seating.js"></script>
</body>
</html>
