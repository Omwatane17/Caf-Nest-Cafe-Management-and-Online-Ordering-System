<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaféNest – Login / Sign Up</title>
  <meta name="description" content="Sign in or create a CaféNest account to discover and book your favourite café spots." />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="logo-icon" aria-hidden="true">
        <!-- coffee-cup icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 3h-1V1h-2v2H9V1H7v2H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-1 14H7V9h10v8zm0-10H7V5h10v2zm2 1h1a1 1 0 0 1 0 2h-1v-2z"/>
        </svg>
      </div>
      <h1>CaféNest</h1>
      <p>Your neighbourhood café companion</p>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" role="tab" data-target="login-form" id="tab-login" aria-selected="true">Sign In</button>
      <button class="auth-tab"        role="tab" data-target="signup-form" id="tab-signup" aria-selected="false">Create Account</button>
    </div>

    <!-- Login form -->
    <form class="auth-form visible" id="login-form" novalidate aria-labelledby="tab-login">
      <div class="field">
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" placeholder="••••••••" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-primary" id="btn-login">Sign In</button>
      <div class="auth-divider">or</div>
      <p class="auth-footer">
        No account yet?
        <a href="#" data-switch="signup-form">Create one</a>
      </p>
    </form>

    <!-- Sign-Up form -->
    <form class="auth-form" id="signup-form" novalidate aria-labelledby="tab-signup">
      <div class="field">
        <label for="signup-name">Full name</label>
        <input type="text" id="signup-name" name="name" placeholder="Alex Smith" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="signup-email">Email address</label>
        <input type="email" id="signup-email" name="email" placeholder="you@example.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" placeholder="Min 6 characters" autocomplete="new-password" required />
      </div>
      <div class="field">
        <label for="signup-confirm">Confirm password</label>
        <input type="password" id="signup-confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn-primary" id="btn-signup">Create Account</button>
      <div class="auth-divider">or</div>
      <p class="auth-footer">
        Already have an account?
        <a href="#" data-switch="login-form">Sign in</a>
      </p>
    </form>

  </div>

  <!-- Toast -->
  <div id="login-toast" role="status" aria-live="polite"></div>

  <script src="js/login.js"></script>
  <!-- Backend integration (added for PHP session backend) -->
  <script src="js/api-bridge.js"></script>
</body>
</html>
