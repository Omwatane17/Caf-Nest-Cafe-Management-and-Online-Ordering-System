<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings - CaféNest</title>
  <meta name="description" content="View and manage your upcoming, past, and cancelled cafe table reservations with CaféNest.">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/explore.css">
  <link rel="stylesheet" href="css/bookings.css">
</head>
<body class="bookings-page">

  <!-- SOLID HEADER VARIANT (Matching my bookings.png) -->
  <header class="site-header site-header--solid">
    <div class="container header-container">
      
      <!-- Brand / Logo -->
      <a href="index.html" class="brand" aria-label="CaféNest Home">
        <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z" />
          <line x1="6" y1="2" x2="6" y2="5" />
          <line x1="10" y1="2" x2="10" y2="5" />
          <line x1="14" y1="2" x2="14" y2="5" />
        </svg>
        <div class="brand-text">
          <span class="brand-title">CaféNest</span>
        </div>
      </a>

      <!-- Main Navigation Links -->
      <nav class="main-nav" id="main-nav" aria-label="Main Navigation">
        <a href="index.html" class="nav-link">Home</a>
        <a href="explore.html" class="nav-link">Explore Cafes</a>
        <a href="bookings.html" class="nav-link active" aria-current="page">My Bookings</a>
      </nav>

      <!-- Header Actions: Magnifier + Circular Avatar Icon -->
      <div class="header-actions">
        <button type="button" class="btn-icon" id="header-search-btn" aria-label="Search cafes">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
        
        <button type="button" class="btn-avatar" id="header-avatar-btn" aria-label="User Account">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
          </svg>
        </button>

        <!-- Mobile Nav Toggle -->
        <button type="button" class="mobile-nav-toggle" id="mobile-nav-toggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="main-nav">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN BOOKINGS CONTAINER -->
  <main class="bookings-main">
    
    <!-- Filter Tabs (Upcoming, Past, Cancelled) -->
    <nav class="bookings-tabs-bar" aria-label="Bookings Categories">
      <button type="button" class="tab-btn-pill active" data-tab="upcoming">Upcoming</button>
      <button type="button" class="tab-btn-pill" data-tab="past">Past</button>
      <button type="button" class="tab-btn-pill" data-tab="cancelled">Cancelled</button>
    </nav>

    <!-- Bookings Cards Feed -->
    <section class="bookings-list" id="bookings-list" role="feed" aria-label="Reservations List">
      <!-- Populated dynamically by js/bookings.js -->
    </section>

  </main>

  <!-- Cancel Booking Confirmation Modal -->
  <div class="modal-overlay" id="cancel-booking-modal" role="dialog" aria-modal="true" aria-labelledby="cancel-modal-title">
    <div class="modal-dialog">
      <h3 class="modal-title" id="cancel-modal-title">Cancel Reservation</h3>
      <p style="color: var(--color-muted); font-size: 0.92rem; margin: 12px 0 24px 0; line-height: 1.5;">
        Are you sure you want to cancel your table reservation at <strong id="cancel-modal-cafe" style="color: var(--color-text);">The Brew House</strong>? This action will mark your reservation as cancelled.
      </p>

      <div class="modal-actions">
        <button type="button" class="btn-card-action" id="btn-cancel-modal-keep">Keep Reservation</button>
        <button type="button" class="btn-card-action btn-cancel" id="btn-cancel-modal-confirm" style="background-color: #B91C1C; color: #FFFFFF; border-color: #B91C1C;">Yes, Cancel Booking</button>
      </div>
    </div>
  </div>

  <!-- Shared Footer Mount -->
  <div id="site-footer-mount"></div>

  <!-- Toast Notification Mount -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
  <script src="js/bookings.js"></script>
  <!-- Backend integration (added for PHP session backend) -->
  <script src="js/api-bridge.js"></script>
</body>
</html>
